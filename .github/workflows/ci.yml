name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-client:
    name: server + client (build, test, e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm -r --filter '!dsh-remote-relay-plugin' build
      - name: Unit tests
        run: pnpm -r --filter '!dsh-remote-relay-plugin' test
      - name: End-to-end smoke (real server + real client)
        run: bash scripts/e2e-stub.sh

  plugin:
    name: plugin (drift guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run plugin tests
        # The host half imports @deepseek-ai/* peers that only exist inside a
        # dsh installation, so the standalone typecheck (tsconfig.json) is
        # not part of this job — see plugin/tsconfig.json for the full
        # boundary. What IS verified here is the capability drift guard,
        # which is pure and needs no dsh packages. A dsh-hosted typecheck
        # runs in the dsh integration repository.
        run: pnpm --filter dsh-remote-relay-plugin test

  app:
    name: app (flutter analyze + UI 巡检 + widget tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # 与开发机一致：同一个 Flutter 版本的生成件（l10n）与渲染行为才
          # 可比。写一个「大概能用」的旧版本，只会让 CI 的失败原因变成
          # 「版本不对」而不是真正的回归。
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      # `flutter analyze` from app/ also walks packages/dsh_remote_core, and
      # those specs import package:test — a dev_dependency of the NESTED
      # package, which app's package_config does not carry. A developer's
      # machine hides this because a previous `dart pub get` in that package
      # left a .dart_tool/package_config.json behind for the analyzer to find;
      # a fresh CI checkout has none, so every core spec fails to resolve its
      # own test runner. Publish the nested config before analyzing, so CI
      # sees what the developer's machine already sees.
      - name: Pub get (dsh_remote_core, so its specs resolve package:test)
        working-directory: app/packages/dsh_remote_core
        run: dart pub get
      # 排版/i18n 这类「没人会主动去看」的规则必须由 CI 强制，否则它们会慢慢
      # 失效：每一次顺手改坏的排版都要有人拦。
      - name: Analyze
        run: flutter analyze
      # core 集成测试必须逐文件跑（多文件同跑会随机挂死，见
      # packages/dsh_remote_core 下的 README 注释），所以单独一步。
      #
      # 两处都不对会让这一步永远红：跑在 app/ 里，`flutter test` 拿的是 app 的
      # package_config，而 core 的 spec import 的是 core 自己的 dev_dependency
      # `package:test`，app 那份里没有 —— 整批 spec 直接加载失败（Analyze 那步
      # 此前就先红了，所以这一步从来没跑到过）。而且 `flutter test <目录>` 一次
      # 合跑，正是 D-032 记的会挂死的写法。改成进 core 包逐文件 `dart test`，
      # 包上下文和逐文件两件事同时对上。
      - name: Core API contract tests (one file at a time; see TESTING.md)
        working-directory: app/packages/dsh_remote_core
        run: |
          for f in test/api/*_test.dart; do
            echo "── $f"
            dart test "$f" || exit 1
          done
      # UI 巡检单独点名跑一次：它是「所有界面 × 所有状态 × 所有子表面」的
      # 覆盖面清单（app/test/ui_sweep/）。在全量输出里它会被淹没，单独跑
      # 才能在 CI 日志里一眼看到覆盖面。
      - name: UI 巡检（清单驱动 + 排版规则 + 行为回归）
        run: flutter test test/ui_sweep
      # golden 用 `--exclude-tags`（见 app/dart_test.yaml）：像素基线在 Linux
      # runner 上必然漂，长期红的检查等于没有检查。
      - name: Widget tests
        run: flutter test --exclude-tags golden

  secrets:
    name: no secrets or private hosts committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not just the tip: a real leak rode along in a commit
          # message on this repository, and a tree-only scan cannot see it.
          fetch-depth: 0
      - name: Prove the guard still fails on a planted leak
        # A guard nobody has watched fail is indistinguishable from one that
        # does nothing. This was not hypothetical — the previous version of
        # this job skipped '*.md' outright and passed a tree that contained a
        # private hostname in the documentation.
        run: bash scripts/scan-secrets.selftest.sh
      - name: Scan tracked files and every commit message
        run: bash scripts/scan-secrets.sh --history
